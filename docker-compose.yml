services:
  postgres:
    image: postgres:16-alpine
    container_name: gitdebt-postgres
    restart: unless-stopped
    environment:
      # Defaults are fine for local dev; `DATABASE_URL` consumes the same
      # values from the backend side.
      POSTGRES_DB: ${POSTGRES_DB:-gitdebt}
      POSTGRES_USER: ${POSTGRES_USER:-gitdebt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gitdebt}
    ports:
      - "5432:5432"
    volumes:
      # Named volume so Postgres' on-disk format is owned by the container's
      # uid/gid, not the host user. Survives `docker compose down`.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gitdebt} -d ${POSTGRES_DB:-gitdebt}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gitdebt-redis
    restart: unless-stopped
    ports:
      # Non-default host port so a system Redis on 6379 never collides;
      # matches REDIS_URL=redis://localhost:6390 in backend/.env.example.
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
