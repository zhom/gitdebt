version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:17"
      timezone: Asia/Yerevan
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:27"
      timezone: Asia/Yerevan
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
      day: monday
      time: "06:37"
      timezone: Asia/Yerevan
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:47"
      timezone: Asia/Yerevan
    open-pull-requests-limit: 10
