name: refresh static site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLIC_API_BASE: https://api.gitdebt.com
  PUBLIC_SITE_URL: https://gitdebt.com
  STATIC_CATALOG_REQUIRED: "1"
  STATIC_REPO_LIMIT: "3000"

jobs:
  deploy:
    name: build and deploy
    if: github.repository == 'zhom/gitdebt'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Per job, so a new run's deploy never waits for an older pre-render.
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: true
    environment:
      name: production
      url: https://gitdebt.com

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test routing
        run: pnpm --filter gitdebt-frontend test

      - name: Build static site
        run: pnpm --filter gitdebt-frontend build

      - name: Enforce Cloudflare Pages free-plan file limit
        shell: bash
        run: |
          file_count=$(find frontend/dist -type f | wc -l)
          echo "Static output contains ${file_count} files"
          test "${file_count}" -le 20000

      - name: Deploy to Cloudflare Pages
        working-directory: frontend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler pages deploy dist
          --project-name=gitdebt
          --branch=main
          --commit-hash="${GITHUB_SHA}"

  # Warms the catalog after each deploy. A job of its own: it runs longer than the
  # deploy and must not hide the deploy's result.
  prewarm:
    name: pre-render catalog
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 110
    concurrency:
      group: gitdebt-prewarm
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-collect and pre-render catalog repositories
        run: pnpm --filter gitdebt-frontend prewarm
